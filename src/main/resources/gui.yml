# ====================================================================
#  SlotMachine - gui.yml  (MENU, EMPLACEMENTS, ICÔNES, TEXTES DES ITEMS)
# ====================================================================
#
#  TOUTES les icônes ci-dessous (symboles, cagnottes, boutons, mises, filler...) acceptent :
#    item         : un Material (DIAMOND)  OU  un item Nexo -> "nexo:id_de_litem"
#    name / lore  : MiniMessage (si absents, le nom/lore de l'item Nexo sont conservés)
#    item-model   : "namespace:cle" (modèle d'item du resource pack, optionnel)
#    glow         : true/false
#    hide-tooltip : true/false
#
#  Vérifie tes items avec  /roulette checkitems  (liste ceux qui sont introuvables).
#
#  PLUSIEURS SLOTS POUR UN MÊME OBJET : remplace "slot: 3" par "slots: [3, 4, 12, 13]".
#  Valable pour : chaque cagnotte (pools.*), spin, info, paytable.
#  Pour les mises : buttons.bet.slots = une entrée par mise, chaque entrée est un slot ou une liste
#  de slots, ex:  [[45, 46], [47, 48], [49, 50], [51, 52]]
#
#  TITRE AVEC GLYPHE NEXO : colle directement le caractère unicode de ton glyphe Nexo
#  dans "title" (les offsets négatifs fonctionnent aussi), ou utilise la balise <glyph:id>
#  si ton Nexo remplace les glyphes dans les titres d'inventaire.

title: "<gradient:gold:yellow><bold>MACHINE A SOUS</bold></gradient>"
rows: 6
refresh-ticks: 40            # rafraîchissement des cagnottes pendant que le menu est ouvert

# Cases vides : par défaut elles RESTENT VIDES (idéal avec un fond de glyphe Nexo).
# Mets enabled: true pour les remplir avec l'item ci-dessous.
filler:
  enabled: false
  item: BLACK_STAINED_GLASS_PANE   # ex: "nexo:vide"
  name: " "
  hide-tooltip: true

# Animation de cadre lors d'un gain. DÉSACTIVÉE par défaut : les cases vides ne bougent plus.
# (Si activée, elle ne s'applique qu'aux cases vides.)
win-frame:
  enabled: false
  materials:
    - LIME_STAINED_GLASS_PANE
    - YELLOW_STAINED_GLASS_PANE
    - ORANGE_STAINED_GLASS_PANE
    - RED_STAINED_GLASS_PANE
    - MAGENTA_STAINED_GLASS_PANE
    - LIGHT_BLUE_STAINED_GLASS_PANE

# Grille 3x3 (rangée -> slots des rouleaux 1, 2, 3)
reels:
  row-1: [12, 13, 14]
  row-2: [21, 22, 23]
  row-3: [30, 31, 32]

# Cagnottes (la clé doit correspondre à rewards.yml). Placeholders : <amount> <min-bet>
# La cagnotte est COMMUNE à tous les joueurs et se met à jour en direct.
# Le palier gagné s'illumine (glow) sur TOUS ses slots pendant la roue.
pools:
  mini:
    slots: [1]                       # ex: [1, 2, 10, 11]
    item: COPPER_INGOT               # ex: "nexo:pool_mini"
    name: "<#cd7f32><bold>MINI"
    lore:
      - "<gray>Cagnotte : <yellow><amount>"
      - "<dark_gray>Mise minimale : <min-bet>"
  major:
    slots: [3]
    item: GOLD_BLOCK                 # ex: "nexo:pool_major"
    name: "<yellow><bold>MAJOR"
    lore:
      - "<gray>Cagnotte : <yellow><amount>"
      - "<dark_gray>Mise minimale : <min-bet>"
  giant:
    slots: [5]
    item: DIAMOND_BLOCK              # ex: "nexo:pool_giant"
    name: "<aqua><bold>GIANT"
    lore:
      - "<gray>Cagnotte : <yellow><amount>"
      - "<dark_gray>Mise minimale : <min-bet>"
  jackpot:
    slots: [7]
    item: NETHER_STAR                # ex: "nexo:pool_jackpot"
    name: "<gradient:#ff0000:#ffd700><bold>JACKPOT"
    lore:
      - "<gray>Cagnotte : <yellow><amount>"
      - "<dark_gray>Mise minimale : <min-bet>"

# Boutons. Placeholders : <bet> <total> <lines> <balance> <last-win> <free-spins> <free-win>
buttons:
  spin:
    slots: [49]                      # ex: [48, 49, 50] -> le même bouton sur 3 slots
    item: LIME_CONCRETE              # ex: "nexo:btn_lancer"
    name: "<green><bold>LANCER"
    lore:
      - "<gray>Mise totale : <yellow><total>"
      - "<gray>Lignes actives : <white><lines>"
      - ""
      - "<yellow>Clique pour jouer !"
  spin-busy:
    item: RED_CONCRETE               # ex: "nexo:btn_lancer_busy"
    name: "<red><bold>EN COURS..."
    lore: ["<gray>Les rouleaux tournent."]
  spin-free:
    item: PURPLE_CONCRETE            # ex: "nexo:btn_free"
    name: "<light_purple><bold>FREE SPIN"
    lore:
      - "<gray>Tours gratuits restants : <yellow><free-spins>"
      - "<gray>Mise : <yellow><total>"
      - "<gray>Gains de la série : <yellow><free-win>"
      - ""
      - "<yellow>Clique pour jouer !"
  # Boutons de mise : un par valeur de "bets" (config.yml), dans l'ordre
  bet:
    slots: [45, 46, 47, 48]          # ex: [[45, 46], [47, 48], [49, 50], [51, 52]]
    item: GOLD_NUGGET
    name: "<yellow>Mise : <white><bet>"
    lore: ["<gray>Coût total : <yellow><total>", "", "<gray>Clique pour choisir"]
  bet-selected:
    item: GOLD_INGOT
    name: "<green><bold>Mise : <white><bet>"
    lore: ["<gray>Coût total : <yellow><total>", "", "<green>Mise sélectionnée"]
    glow: true
  # Icônes personnalisées par montant (remplace "item" pour cette mise), ex : jetons Nexo.
  # Les clés sont les montants des mises, sans séparateur.
  bet-icons: {}
  #  "1000": "nexo:chip_1k"
  #  "10000": "nexo:chip_10k"
  #  "100000": "nexo:chip_100k"
  #  "1000000": "nexo:chip_1m"
  info:
    slots: [50]
    item: PAPER                      # ex: "nexo:btn_info"
    name: "<gold>Ton compte"
    lore:
      - "<gray>Solde : <yellow><balance>"
      - "<gray>Dernier gain : <yellow><last-win>"
      - "<gray>Free spins : <light_purple><free-spins>"
  paytable:
    slots: [51]
    item: BOOK                       # ex: "nexo:btn_paytable"
    name: "<gold><bold>Table des gains"
    # Description COMPLÈTE de la table des gains : une ligne par entrée, tu peux tout modifier / supprimer / ajouter.
    # Placeholders (valeurs prises dans rewards.yml, donc toujours à jour) :
    #   <cherry-name> <cherry-pair> <cherry-triple>   (idem pour lemon, grape, bell, bar, seven, wild, scatter, bonus :
    #                                                  <ID-name> <ID-pair> <ID-triple>)
    #   <free-spins-3> <free-spins-4> <free-spins-5> <free-spins-6>   free spins selon le nombre de scatters
    #   <free-multiplier> <bonus-required> <match-required>
    #   <tier-mini> <pool-mini> <minbet-mini>          (idem major, giant, jackpot : nom, cagnotte actuelle, mise minimale)
    #   <bet> <total> <lines> <balance> <last-win> <free-spins>
    # Si "lore" est vide ([]), le plugin génère l'ancien affichage depuis messages.yml -> paytable.
    lore:
      - "<dark_gray>------------------------------"
      - "<gold><bold>TABLE DES GAINS <gray>(x mise par ligne)"
      - "<dark_gray>------------------------------"
      - ""
      - "<cherry-name> <gray>paire <yellow><cherry-pair> <dark_gray>| <gray>triple <green><cherry-triple>"
      - "<lemon-name> <gray>paire <yellow><lemon-pair> <dark_gray>| <gray>triple <green><lemon-triple>"
      - "<grape-name> <gray>paire <yellow><grape-pair> <dark_gray>| <gray>triple <green><grape-triple>"
      - "<bell-name> <gray>paire <yellow><bell-pair> <dark_gray>| <gray>triple <green><bell-triple>"
      - "<bar-name> <gray>paire <yellow><bar-pair> <dark_gray>| <gray>triple <green><bar-triple>"
      - "<seven-name> <gray>paire <yellow><seven-pair> <dark_gray>| <gray>triple <green><seven-triple>"
      - ""
      - "<wild-name> <gray>remplace les autres symboles"
      - "<gray>  3 <wild-name> <gray>sur la ligne : <green><wild-triple>"
      - ""
      - "<scatter-name> <gray>n'importe où sur la grille :"
      - "<gray>  3 = <light_purple><free-spins-3> <gray>free spins <dark_gray>| <gray>4 = <light_purple><free-spins-4>"
      - "<gray>  5 = <light_purple><free-spins-5> <dark_gray>| <gray>6 = <light_purple><free-spins-6>"
      - "<gray>  Gains des free spins : <yellow>x<free-multiplier>"
      - ""
      - "<bonus-name> <gray><bonus-required> n'importe où : <light_purple>jeu des cartes"
      - "<gray>  Trouve <yellow><match-required> <gray>cartes identiques pour gagner :"
      - "<gray>  <tier-mini> <dark_gray>: <yellow><pool-mini>"
      - "<gray>  <tier-major> <dark_gray>: <yellow><pool-major> <dark_gray>(dès <minbet-major>)"
      - "<gray>  <tier-giant> <dark_gray>: <yellow><pool-giant> <dark_gray>(dès <minbet-giant>)"
      - "<gray>  <tier-jackpot> <dark_gray>: <yellow><pool-jackpot> <dark_gray>(dès <minbet-jackpot>)"
      - ""
      - "<dark_gray>Cagnottes communes à tous les joueurs"
      - "<dark_gray>------------------------------"

# Symboles des rouleaux (la clé doit correspondre à rewards.yml).
symbols:
  cherry:
    item: SWEET_BERRIES              # ex: "nexo:slot_cherry"
    name: "<red>Cerise"
  lemon:
    item: YELLOW_DYE                 # ex: "nexo:slot_lemon"
    name: "<yellow>Citron"
  grape:
    item: AMETHYST_SHARD             # ex: "nexo:slot_grape"
    name: "<light_purple>Raisin"
  bell:
    item: BELL                       # ex: "nexo:slot_bell"
    name: "<gold>Cloche"
  bar:
    item: GOLD_INGOT                 # ex: "nexo:slot_bar"
    name: "<yellow><bold>BAR"
  seven:
    item: DIAMOND                    # ex: "nexo:slot_seven"
    name: "<red><bold>7"
  wild:
    item: ENCHANTED_GOLDEN_APPLE     # ex: "nexo:slot_wild"
    name: "<gold><bold>WILD"
    lore: ["<gray>Remplace les autres symboles"]
  scatter:
    item: ENDER_EYE                  # ex: "nexo:slot_scatter"
    name: "<light_purple><bold>SCATTER"
    lore: ["<gray>3+ n'importe où = free spins"]
  bonus:
    item: HEART_OF_THE_SEA           # ex: "nexo:slot_bonus"
    name: "<aqua><bold>BONUS"
    lore: ["<gray>3+ n'importe où = roue des cagnottes"]

# ====================================================================
#  MENU BONUS : cartes retournées (déclenché par 3 symboles BONUS)
#  Le joueur retourne les cartes ; 3 cartes identiques = il gagne ce palier (Mini, Major...).
#  Mêmes règles que le reste : "item" = Material ou "nexo:id", textes en MiniMessage / &c / #hex.
#  Placeholders des items : <tier> <amount> <min-bet> <found> <need>
# ====================================================================
bonus-game:
  title: "<gold><bold>BONUS <gray>- Trouve 3 cartes identiques"
  rows: 6
  # 21 emplacements de cartes (3 rangées de 7)
  cards: [10, 11, 12, 13, 14, 15, 16,
          19, 20, 21, 22, 23, 24, 25,
          28, 29, 30, 31, 32, 33, 34]
  # Cases vides : vides par défaut (mets enabled: true pour les remplir)
  filler:
    enabled: false
    item: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  # Progression (cartes trouvées par palier)
  info:
    slots: [4]
    item: PAPER                     # ex: "nexo:bonus_info"
    name: "<gold><bold>Progression"
    lore:
      - "<gray>Trouve <yellow><need></yellow> cartes identiques"
      - ""
  tier-line: "<tier> <gray>: <yellow><found><gray>/<yellow><need>"
  # Carte face cachée
  card-hidden:
    item: ENDER_CHEST               # ex: "nexo:card_back"
    name: "<gray><bold>Carte mystère"
    lore: ["<yellow>Clique pour la retourner !"]
  # Carte en train de se retourner (animation courte)
  card-flip:
    item: PAPER                     # ex: "nexo:card_flip"
    name: "<white>..."
  # Carte retournée, par palier (la clé = celle de rewards.yml)
  revealed:
    mini:
      item: COPPER_INGOT            # ex: "nexo:card_mini"
      name: "<#cd7f32><bold>MINI"
      lore: ["<gray>Cagnotte : <yellow><amount>"]
    major:
      item: GOLD_BLOCK              # ex: "nexo:card_major"
      name: "<yellow><bold>MAJOR"
      lore: ["<gray>Cagnotte : <yellow><amount>"]
    giant:
      item: DIAMOND_BLOCK           # ex: "nexo:card_giant"
      name: "<aqua><bold>GIANT"
      lore: ["<gray>Cagnotte : <yellow><amount>"]
    jackpot:
      item: NETHER_STAR             # ex: "nexo:card_jackpot"
      name: "<gradient:#ff0000:#ffd700><bold>JACKPOT"
      lore: ["<gray>Cagnotte : <yellow><amount>"]
